services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_signal_lab}
      POSTGRES_USER: ${POSTGRES_USER:-market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market_password}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-market} -d ${POSTGRES_DB:-market_signal_lab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://market:market_password@db:5432/market_signal_lab}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tokyo}
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-live}
      FRED_API_KEY: ${FRED_API_KEY:-}
      FRED_BASE_URL: ${FRED_BASE_URL:-https://api.stlouisfed.org/fred}
      JQUANTS_API_KEY: ${JQUANTS_API_KEY:-}
      JQUANTS_BASE_URL: ${JQUANTS_BASE_URL:-https://api.jquants.com}
      JQUANTS_MIN_REQUEST_INTERVAL_SECONDS: ${JQUANTS_MIN_REQUEST_INTERVAL_SECONDS:-15}
      DATA_STALE_AFTER_DAYS: ${DATA_STALE_AFTER_DAYS:-7}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./backups:/backups
    command: >
      streamlit run app/dashboard/streamlit_app.py --server.address=0.0.0.0 --server.port=8501

  lite:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://market:market_password@db:5432/market_signal_lab}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tokyo}
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-live}
      DATA_STALE_AFTER_DAYS: ${DATA_STALE_AFTER_DAYS:-7}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8502:8502"
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./backups:/backups
    command: >
      streamlit run app/lite_dashboard/streamlit_app.py --server.address=0.0.0.0 --server.port=8502

  jquants-collector:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://market:market_password@db:5432/market_signal_lab}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tokyo}
      JQUANTS_API_KEY: ${JQUANTS_API_KEY:-}
      JQUANTS_BASE_URL: ${JQUANTS_BASE_URL:-https://api.jquants.com}
      JQUANTS_MIN_REQUEST_INTERVAL_SECONDS: ${JQUANTS_MIN_REQUEST_INTERVAL_SECONDS:-15}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-20}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ./logs:/app/logs
    command: >
      python jobs/collect_jquants_all_prices.py --continuous --limit 1 --lag-days 91 --recent-session-count 30 --history-days 720

volumes:
  postgres_data:
